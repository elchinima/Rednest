<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g>
    <!-- Парение -->
    <animateTransform attributeName="transform" type="translate" values="0 2; 0 -2; 0 2" dur="3s" repeatCount="indefinite" />
    <animateTransform attributeName="transform" type="rotate" values="2 50 50; -2 50 50; 2 50 50" dur="4s" repeatCount="indefinite" additive="sum" />

    <!-- Банковская карта -->
    <rect x="14" y="24" width="72" height="52" rx="8" stroke="#ffffff" stroke-width="5" fill="none" stroke-linejoin="round" />

    <!-- Магнитная полоса / верхняя линия -->
    <line x1="14" y1="40" x2="86" y2="40" stroke="#ffffff" stroke-width="5" opacity="0.6" />

    <!-- Чип карты (светящийся красный акцент) -->
    <rect x="24" y="48" width="16" height="12" rx="3" fill="#ef4444">
      <animate attributeName="opacity" values="0.9; 0.4; 0.9" dur="2s" repeatCount="indefinite" />
    </rect>

    <!-- Бесконтактные волны (NFC / Online) - уменьшены на 50% -->
    <path d="M 65 52.5 A 4 4 0 0 1 65 57.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" />
    <path d="M 68.5 50 A 7 7 0 0 1 68.5 60" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 72 47.5 A 10 10 0 0 1 72 62.5" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" fill="none" opacity="0.5" />
  </g>
</svg>
