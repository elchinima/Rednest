<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g>
    <!-- Парение -->
    <animateTransform attributeName="transform" type="translate" values="0 2; 0 -2; 0 2" dur="3s" repeatCount="indefinite" />
    
    <g>
      <!-- Медленное вращение колеса -->
      <animateTransform attributeName="transform" type="rotate" values="0 50 50; 360 50 50" dur="24s" repeatCount="indefinite" />
      
      <!-- Внешний контур (радиус 45, как у смайлика) -->
      <circle cx="50" cy="50" r="45" stroke="#ffffff" stroke-width="5"/>
      
      <!-- Спицы колеса (рисуются первыми, чтобы быть ПОД красной точкой) -->
      <line x1="50" y1="5" x2="50" y2="95" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="5" y1="50" x2="95" y2="50" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      
      <!-- Диагональные спицы -->
      <line x1="18" y1="18" x2="82" y2="82" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      <line x1="18" y1="82" x2="82" y2="18" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
      
      <!-- Центральная ось (сделана красной, рисуется поверх спиц) -->
      <circle cx="50" cy="50" r="8" fill="#e74c3c" />
      
      <!-- Красные пульсирующие акценты на ободе -->
      <circle cx="50" cy="5" r="4" fill="#e74c3c" opacity="0.8">
         <animate attributeName="opacity" values="0.8; 0.2; 0.8" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="50" cy="95" r="4" fill="#e74c3c" opacity="0.8">
         <animate attributeName="opacity" values="0.8; 0.2; 0.8" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="5" cy="50" r="4" fill="#e74c3c" opacity="0.8">
         <animate attributeName="opacity" values="0.8; 0.2; 0.8" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="95" cy="50" r="4" fill="#e74c3c" opacity="0.8">
         <animate attributeName="opacity" values="0.8; 0.2; 0.8" dur="2.5s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>
</svg>
