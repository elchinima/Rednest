<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <g>
    <!-- Легкое парение вверх-вниз -->
    <animateTransform attributeName="transform" type="translate" values="0 2; 0 -2; 0 2" dur="3s" repeatCount="indefinite" />
    <!-- Небольшой наклон для живости -->
    <animateTransform attributeName="transform" type="rotate" values="-2.5 50 50; 2.5 50 50; -2.5 50 50" dur="4s" repeatCount="indefinite" additive="sum" />

    <!-- Внешний контур купона/билета с вырезами по бокам -->
    <path 
      d="M 22 24 L 78 24 C 83.5 24 88 28.5 88 34 L 88 44 C 83 44 79 47 79 51 C 79 55 83 58 88 58 L 88 68 C 88 73.5 83.5 78 78 78 L 22 78 C 16.5 78 12 73.5 12 68 L 12 58 C 17 58 21 55 21 51 C 21 47 17 44 12 44 L 12 34 C 12 28.5 16.5 24 22 24 Z" 
      stroke="#ffffff" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Вертикальная пунктирная линия перфорации -->
    <line x1="42" y1="31" x2="42" y2="71" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 7" opacity="0.75" />

    <!-- Красный значок/акцент (стилизованный процент и сияние) -->
    <!-- Левая секция: Звезда/Скидка -->
    <circle cx="28" cy="51" r="5" fill="#ef4444">
      <animate attributeName="opacity" values="0.9; 0.4; 0.9" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Правая секция: Символ % с красными точками -->
    <line x1="72" y1="39" x2="56" y2="63" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="58" cy="42" r="3.5" fill="#ef4444">
      <animate attributeName="opacity" values="0.9; 0.4; 0.9" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="70" cy="60" r="3.5" fill="#ef4444">
      <animate attributeName="opacity" values="0.9; 0.4; 0.9" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
